<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hekaya Connect · Seat QR codes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #111; background: #fff; }
  .bar { padding: 16px 20px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #ddd; flex-wrap: wrap; }
  .bar b { font-size: 16px; }
  .bar span { color: #666; font-size: 13px; flex: 1; }
  .bar button { height: 38px; padding: 0 16px; border-radius: 8px; border: 0; background: #111; color: #fff; font-weight: 600; cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); padding: 10mm; }
  .card { border: 1px dashed #bbb; padding: 6mm 4mm; text-align: center; break-inside: avoid; }
  .card small { display: block; font-size: 9px; letter-spacing: .3em; text-transform: uppercase; color: #b07f1f; }
  .card .seat { font-size: 34px; font-weight: 900; margin: 2px 0 4px; letter-spacing: .04em; }
  .card img { width: 32mm; height: 32mm; display: block; margin: 0 auto; }
  .card p { font-size: 10px; color: #666; margin: 6px 0 0; line-height: 1.35; }
  @media print { .bar { display: none; } .grid { padding: 6mm; } }
  @page { size: A4; margin: 8mm; }
</style>
</head>
<body>
<div class="bar"><b>Seat QR codes</b><span>One card per seat. Each code opens Hekaya Connect with the seat already picked.</span><button onclick="window.print()">Print</button></div>
<div class="grid" id="grid"></div>
<script>
  fetch('/api/layout').then((r) => r.json()).then((l) => {
    document.getElementById('grid').innerHTML = l.labels.slice(1).map((lab) =>
      `<div class="card"><small>Hekaya Connect</small><div class="seat">${lab}</div><img src="/qr.svg?seat=${lab}" alt="QR code for seat ${lab}"><p>Scan with your camera.<br>No app needed.</p></div>`).join('');
  });
</script>
</body>
</html>
